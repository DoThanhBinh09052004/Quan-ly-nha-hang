<div class="card">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
  
    <p-toolbar class="mb-4">
      <ng-template pTemplate="start">
        <p-button icon="pi pi-plus" label="Thêm ảnh" class="mr-2" [rounded]="true" [outlined]="true" (click)="openNew()" />
      </ng-template>
  
      <ng-template pTemplate="end">
        <p-fileUpload
          #fileUpload
          mode="basic"
          accept="image/*"
          [auto]="true"
          [customUpload]="true"
          chooseLabel="Chọn ảnh"
          (uploadHandler)="uploadImage($event)">
        </p-fileUpload>
      </ng-template>
    </p-toolbar>
  
    <p-table
      #dt
      [value]="images"
      [paginator]="true"
      [rows]="10"
      [rowHover]="true"
      dataKey="id"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [showCurrentPageReport]="true">
      
      <ng-template pTemplate="caption">
        <div class="flex items-center justify-between">
          <h5 class="m-0">Quản lý hình ảnh</h5>
          
        </div>
      </ng-template>
  
      <ng-template pTemplate="header">
        <tr>
          <th>Ảnh</th>
          <th>Tên</th>
          <th>Mô tả</th>
          <th>Ngày tạo</th>
          <th>Hành động</th>
        </tr>
      </ng-template>
  
      <ng-template pTemplate="body" let-img>
        <tr>
          <td>
            <img [src]="'data:image/png;base64,' + img.data" width="80" class="rounded" />
          </td>
          <td>{{ img.name }}</td>
          <td>{{ img.description }}</td>
          <td>{{ convertToLocalTime(img.created) | date:'HH:mm dd/MM/yyyy' }}</td>
          <td>
            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteImage(img)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  
    <!-- Dialog upload hình -->
    <p-dialog [(visible)]="ImageDialog" [style]="{ width: '450px' }" header="Upload ảnh" [modal]="true">
      <ng-template pTemplate="content">
        <div class="flex flex-col gap-4">
          <div>
            <label for="name" class="p-field">Tên ảnh</label>
            <input type="text" pInputText id="name" [(ngModel)]="image.name" required />
          </div>
          <div>
            <label for="description" class="p-field">Mô tả</label>
            <textarea pInputText pTextarea id="description" [(ngModel)]="image.description"></textarea>
          </div>
          <p-fileUpload
            #fileUpload
            mode="basic"
            accept="image/*"
            [auto]="true"
            [customUpload]="true"
            chooseLabel="Chọn ảnh"
            (uploadHandler)="uploadImage($event)">
          </p-fileUpload>
        </div>
      </ng-template>
  
      <ng-template pTemplate="footer">
        <p-button label="Hủy" icon="pi pi-times" text (click)="hideDialog()"></p-button>
        <p-button label="Upload" icon="pi pi-check" (click)="uploadImage($event)"></p-button>
      </ng-template>
    </p-dialog>
  </div>
