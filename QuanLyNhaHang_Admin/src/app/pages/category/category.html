<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Quản lý danh mục Admin</title>
        <base href="/">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://unpkg.com/primeicons/primeicons.css" rel="stylesheet" />
        <link href="https://unpkg.com/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="https://primefaces.org/cdn/primeng/images/favicon.png">
        
    </head>
    <body>
        <div class="card">
            <p-toast></p-toast>
            <p-confirmDialog></p-confirmDialog>
            
            <p-toolbar class="mb-4">
              <ng-template pTemplate="start">
                  <p-button icon="pi pi-plus" label="Thêm danh mục" class="mr-2" [rounded]="true" [outlined]="true" (click)="openNew()" />
                  <p-button icon="pi pi-trash" label="Xóa đã chọn" [rounded]="true" [outlined]="true" severity="danger" 
                           [disabled]="!selectedCategories || selectedCategories.length === 0" (click)="deleteSelectedCategories()" />
              </ng-template>
            
            <ng-template pTemplate="end">
                <p-fileUpload
                mode="basic"
                accept="image/*"
                [maxFileSize]="1000000"
                label="Import"
                chooseLabel="Import"
                [auto]="true"
                [customUpload]="true"
                class="mr-2 inline-block"
                [chooseButtonProps]="{ severity: 'secondary' }">
                </p-fileUpload>
            </ng-template>
            </p-toolbar>
            <p-table
            #dt
            [value]="Categories"
            [rows]="10"
            [columns]="cols"
            [paginator]="true"
            [tableStyle]="{ 'min-width': '75rem' }"
            [(selection)]="selectedCategories"
            [rowHover]="true"
            dataKey="id"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [showCurrentPageReport]="true">
          
            <ng-template pTemplate="caption">
              <div class="flex items-center justify-between">
                <h5 class="m-0">Quản lý danh mục</h5>
                <div class="p-input-icon-left">
                  <i class="pi pi-search"></i>
                  <input pInputText type="text" (input)="onGlobalFilter($event, dt)" placeholder="Search..." />
                </div>
              </div>
            </ng-template>
          
            <ng-template pTemplate="header">
              <tr>
                <th style="width: 3rem">
                  <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th style="min-width: 16rem">Mã</th>
                <th pSortableColumn="name" style="min-width:16rem">
                  <div class="flex items-center gap-2">
                    Tên
                    <p-sortIcon field="name"></p-sortIcon>
                  </div>
                </th>
                <th pSortableColumn="description" style="min-width: 12rem">
                  <div class="flex items-center gap-2">
                    Chú thích
                    <p-sortIcon field="description"></p-sortIcon>
                  </div>
                </th>
                <th pSortableColumn="created" style="min-width: 12rem">
                  <div class="flex items-center gap-2">
                    Ngày tạo
                    <p-sortIcon field="created"></p-sortIcon>
                  </div>
                </th>
                <th pSortableColumn="updated" style="min-width: 12rem">
                  <div class="flex items-center gap-2">
                    Ngày chỉnh sửa
                    <p-sortIcon field="updated"></p-sortIcon>
                  </div>
                </th>
                <th style="min-width: 12rem"></th>
              </tr>
            </ng-template>
          
            <ng-template pTemplate="body" let-category>
              <tr>
                <td style="width: 3rem">
                  <p-tableCheckbox [value]="category"></p-tableCheckbox>
                </td>
                <td style="min-width: 16rem">{{ category.id }}</td>
                <td style="min-width: 16rem">{{ category.name }}</td>
                <td>{{ category.description }}</td>
                <td>
                  {{ convertToLocalTime(category.created) | date:'HH:mm dd/MM/yyyy' }}<br/>
                </td>
                <td>
                  {{ convertToLocalTime(category.updated) | date:'HH:mm dd/MM/yyyy' }}<br/>
  
                </td>
                <td>
                  <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editcategory(category)"></p-button>
                  <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deletecategory(category)"></p-button>
                </td>
              </tr>
            </ng-template>
          </p-table>
          
          <p-dialog [(visible)]="categoryDialog" [style]="{ width: '450px' }" header="Thông tin danh mục" [modal]="true">
            <ng-template pTemplate="content">
              <div class="flex flex-col gap-6">
                <div>
                  <label for="name" class="p-field">Tên danh mục</label>
                  <input type="text" pInputText id="name" [(ngModel)]="category.name" required autofocus fluid />
                  <small class="text-red-500" *ngIf="submitted && !category.name">Tên là bắt buộc.</small>
                </div>
                
                <div>
                  <label for="description" class="p-field">Chú thích</label>
                      <textarea  pInputText id="description" pTextarea [(ngModel)]="category.description"   fluid></textarea>
                </div>
              </div>
            </ng-template>
          
            <ng-template pTemplate="footer">
              <p-button label="Hủy" icon="pi pi-times" text (click)="hideDialog()"></p-button>
              <p-button label="Lưu" icon="pi pi-check" (click)="savecategory()"></p-button>
            </ng-template>
          </p-dialog>
          
    </div>
       
    </body>
</html>
