<div class="background">
  <main class="change-password-wrapper">
    <section class="change-password-card" aria-labelledby="page-title">
      <div class="restaurant-header">
        <div class="logo-icon" aria-hidden="true">🍲</div>
        <h1>QUÁN ĂN 1989</h1>
        <p class="slogan">Hệ thống quản lý nội bộ</p>
      </div>

      <h2 id="page-title">Đổi mật khẩu</h2>
      <p class="description">Xác thực tài khoản để đặt mật khẩu mới.</p>

      <form (ngSubmit)="onSubmit()" #changePasswordForm="ngForm" novalidate>
        <div class="input-group">
          <input id="username" [(ngModel)]="username" (ngModelChange)="clearMessages()" type="text" name="username" required placeholder=" " autocomplete="username" />
          <label for="username">Tên đăng nhập</label>
          <span class="icon" aria-hidden="true">👤</span>
        </div>

        <div class="input-group">
          <input [(ngModel)]="oldPassword" (ngModelChange)="clearMessages()" [type]="showOldPassword ? 'text' : 'password'" name="oldPassword" required placeholder=" " autocomplete="current-password" />
          <label>Mật khẩu hiện tại</label>
          <button type="button" class="password-toggle" (click)="showOldPassword = !showOldPassword" [attr.aria-label]="showOldPassword ? 'Ẩn mật khẩu hiện tại' : 'Hiện mật khẩu hiện tại'">
            <i [class]="showOldPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>

        <div class="input-group">
          <input [(ngModel)]="newPassword" (ngModelChange)="clearMessages()" [type]="showNewPassword ? 'text' : 'password'" name="newPassword" required minlength="6" placeholder=" " autocomplete="new-password" />
          <label>Mật khẩu mới</label>
          <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword" [attr.aria-label]="showNewPassword ? 'Ẩn mật khẩu mới' : 'Hiện mật khẩu mới'">
            <i [class]="showNewPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>

        <div class="input-group">
          <input [(ngModel)]="confirmPassword" (ngModelChange)="clearMessages()" [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" required placeholder=" " autocomplete="new-password" [class.invalid]="confirmPassword && !passwordsMatch" />
          <label>Xác nhận mật khẩu mới</label>
          <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Ẩn xác nhận mật khẩu' : 'Hiện xác nhận mật khẩu'">
            <i [class]="showConfirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>

        <p class="password-hint">Mật khẩu mới cần có ít nhất 6 ký tự.</p>
        <p *ngIf="confirmPassword && !passwordsMatch" class="validation-message">Mật khẩu xác nhận chưa khớp.</p>

        <button type="submit" class="btn-submit" [disabled]="changePasswordForm.invalid || !passwordsMatch || isSubmitting">
          {{ isSubmitting ? 'Đang cập nhật...' : 'Cập nhật mật khẩu' }}
        </button>

        <p *ngIf="errorMessage" class="message error-message" role="alert">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="message success-message" role="status">{{ successMessage }}</p>
      </form>

      <a routerLink="/login" class="back-link">← Quay lại đăng nhập</a>
    </section>
  </main>
</div>
