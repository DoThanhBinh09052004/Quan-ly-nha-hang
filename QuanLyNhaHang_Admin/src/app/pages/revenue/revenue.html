<div class="management-container">
  
  <app-revenue-header
    [currentDate]="currentDate"
    [loading]="loading"
    [activeTab]="activeTab"
    (refresh)="refreshDashboard()"
    (tabChange)="setTab($event)"
    (exportClick)="showExportDialog = true">
  </app-revenue-header>

  <div *ngIf="loadError" class="inline-error" style="color: #f87171; padding: 12px; background: rgba(248,113,113,0.1); border-radius: 8px; margin-bottom: 20px;">
    {{ loadError }}
  </div>

  <div *ngIf="loading" class="empty-state">
    <div class="empty-content"><i class="pi pi-spin pi-spinner empty-icon"></i><h3>Đang tải dữ liệu...</h3></div>
  </div>

  <ng-container *ngIf="!loading">

    <div *ngIf="activeTab === 'gross' || activeTab === 'net'">
      <div class="management-card">
        <app-revenue-kpi
          [reportPeriod]="reportPeriod"
          [activeTab]="activeTab"
          [kpiRevenue]="kpiRevenue"
          [kpiCost]="kpiCost"
          [kpiProfit]="kpiProfit"
          [kpiMargin]="kpiMargin"
          (periodChange)="setPeriod($event)">
        </app-revenue-kpi>

        <app-revenue-profit-charts
          [labels]="chartLabels"
          [revenueData]="chartRevenueData"
          [profitData]="chartProfitData"
          [kpiMargin]="kpiMargin">
        </app-revenue-profit-charts>
      </div>

      <app-revenue-expense-panel
        [expenseMonth]="expenseMonth"
        [totalExpense]="totalExpense"
        [expenses]="expenses"
        [expenseBreakdown]="expenseBreakdown"
        (monthChange)="onExpenseMonthChange($event)"
        (addClick)="openExpenseDialog()">
      </app-revenue-expense-panel>
    </div>

    <div *ngIf="activeTab === 'forecast'">
      <app-revenue-forecast
        [inputDate]="aiInputDate"
        [aiLoading]="aiLoading"
        [forecastData]="forecastData"
        [aiForecastData]="aiForecastData"
        (inputDateChange)="onInputDateChange($event)"
        (predictClick)="submitAiPrediction($event)">
      </app-revenue-forecast>
    </div>

    <app-revenue-insight-charts
      [byHourData]="byHourData"
      [byDowData]="byDayOfWeekData"
      [byPartySizeData]="byPartySizeData">
    </app-revenue-insight-charts>

    <app-revenue-detailed-panels
      [isDaily]="isDaily"
      [dailyData]="dailyData"
      [monthlyData]="monthlyData"
      [byHourData]="byHourData"
      [byDayOfWeekData]="byDayOfWeekData"
      [byPartySizeData]="byPartySizeData"
      [bestSellersData]="bestSellersData"
      [forecastData]="forecastData"
      [aiForecastData]="aiForecastData"
      [tableTurnover]="tableTurnover"
      [queryDays]="queryDays"
      (mainViewChange)="setMainView($event)">
    </app-revenue-detailed-panels>

    <app-revenue-analysis
      [activeTab]="activeTab"
      [kpiRevenue]="kpiRevenue"
      [kpiCost]="kpiCost"
      [kpiProfit]="kpiProfit"
      [topSeller]="topSeller"
      [categoryData]="categoryData"
      [bestSellersData]="bestSellersData"
      [tableTurnover]="tableTurnover"
      [totalCategoryRevenue]="totalCategoryRevenue">
    </app-revenue-analysis>

  </ng-container>

  <app-business-chatbot
    [chatMessages]="chatMessages"
    [chatLoading]="chatLoading"
    [chatMinimized]="chatMinimized"
    [chatOpen]="chatOpen"
    [chatInput]="chatInput"
    (toggle)="onToggleChat()"
    (close)="onCloseChat()"
    (open)="onOpenChat()"
    (chatInputChange)="onChatInputChange($event)"
    (submitChat)="submitBusinessChat($event)">
  </app-business-chatbot>

  <app-expense-form-dialog
    [visible]="showExpenseDialog"
    [expenseCategories]="expenseCategories"
    [expenseSaving]="expenseSaving"
    [editingExpense]="editingExpense"
    (visibleChange)="onExpenseDialogChange($event)"
    (save)="saveExpense($event)">
  </app-expense-form-dialog>

  <app-revenue-export-dialog
    [(visible)]="showExportDialog">
  </app-revenue-export-dialog>

</div>
