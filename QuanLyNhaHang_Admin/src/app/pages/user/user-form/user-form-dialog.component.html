<p-dialog
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '500px', maxWidth: '95vw' }"
  [header]="user.id ? 'Chỉnh sửa người dùng' : 'Thêm người dùng mới'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false">
  <div class="dialog-form">
    <div class="form-field">
      <label for="username">Tên đăng nhập <span class="required">*</span></label>
      <input
        id="username"
        pInputText
        [(ngModel)]="user.username"
        placeholder="Nhập tên đăng nhập..." />
      <small *ngIf="submitted && !user.username.trim()" class="text-red-500">
        Tên đăng nhập là bắt buộc.
      </small>
    </div>

    <div class="form-field">
      <label for="full-name">Họ và tên</label>
      <input id="full-name" pInputText [(ngModel)]="user.fullName" />
    </div>

    <div class="form-field">
      <label for="password">Mật khẩu</label>
      <input
        id="password"
        pInputText
        type="password"
        [(ngModel)]="user.password"
        [placeholder]="user.id ? 'Để trống nếu không đổi' : 'Nhập mật khẩu'" />
    </div>

    <div class="form-field">
      <label for="shift-salary">Lương theo ca</label>
      <p-inputNumber
        inputId="shift-salary"
        [(ngModel)]="user.shiftSalary"
        mode="currency"
        currency="VND"
        locale="vi-VN"
        [min]="0">
      </p-inputNumber>
    </div>

    <div class="form-field">
      <label for="role">Vai trò <span class="required">*</span></label>
      <p-autoComplete
        inputId="role"
        [(ngModel)]="role"
        [suggestions]="roleResults"
        (completeMethod)="searchRoles($event)"
        optionLabel="name"
        [dropdown]="true"
        [forceSelection]="true"
        placeholder="Chọn vai trò">
      </p-autoComplete>
      <small *ngIf="submitted && !role" class="text-red-500">
        Vui lòng chọn vai trò.
      </small>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button pButton label="Hủy" class="btn-cancel" (click)="close()"></button>
    <button pButton icon="pi pi-check" label="Lưu" (click)="submit()"></button>
  </ng-template>
</p-dialog>
