<p-toast></p-toast><p-confirmDialog></p-confirmDialog>
<div class="management-container">
  <app-user-header [selectedCount]="selectedUsers.length" (create)="openNew()" (reload)="loadData();loadScheduleData()" (payroll)="openPayroll()" (deleteSelected)="deleteSelectedUsers()"></app-user-header>
  <app-weekly-schedule [users]="Users" [shifts]="shifts" [workShifts]="workShifts" [weekStart]="weekStart" [selectedUser]="selectedScheduleUser" [(userDialog)]="scheduleDialog" (previous)="previousWeek()" (next)="nextWeek()" (today)="goToCurrentWeek()" (assign)="openAssignment($event.date,$event.shift,$event.assignment)"></app-weekly-schedule>
  <app-user-table [users]="Users" [(selected)]="selectedUsers" [shiftCounts]="shiftCounts" (edit)="editUser($event)" (remove)="deleteUser($event)" (schedule)="openUserSchedule($event)"></app-user-table>
</div>
<app-user-form-dialog [(visible)]="UserDialog" [user]="User" [roles]="roles" [role]="selectedRole" [submitted]="submitted" (save)="saveForm($event)"></app-user-form-dialog>
<app-shift-assignment-dialog [(visible)]="assignmentDialog" [date]="selectedDate" [shift]="selectedShift" [users]="Users" [assignments]="selectedAssignments" (add)="assignEmployee($event)" (remove)="removeAssignment($event)"></app-shift-assignment-dialog>
<app-payroll-report-dialog [(visible)]="payrollDialog" [period]="payrollPeriod" [report]="payrollReport" (periodChange)="onPayrollPeriod($event)" (exportReport)="exportPayroll()"></app-payroll-report-dialog>
