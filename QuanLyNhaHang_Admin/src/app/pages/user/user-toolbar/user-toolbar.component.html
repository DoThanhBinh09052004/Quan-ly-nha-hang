<section class="management-card">
  <div class="management-header">
    <div class="header-title">
      <h1>Quản lý người dùng</h1>
      <p>Quản lý tài khoản, vai trò, ca làm việc và lương nhân viên.</p>
    </div>
  </div>

  <div class="management-toolbar">
    <div class="toolbar-left">
      <p-button
        icon="pi pi-plus"
        label="Thêm người dùng"
        [rounded]="true"
        (click)="create.emit()">
      </p-button>
      <p-button
        icon="pi pi-trash"
        label="Xóa đã chọn"
        severity="danger"
        [rounded]="true"
        [outlined]="true"
        [disabled]="!selectedCount"
        (click)="deleteSelected.emit()">
      </p-button>
    </div>

    <div class="toolbar-right">
      <p-button
        icon="pi pi-file-export"
        label="Báo cáo lương"
        severity="secondary"
        [outlined]="true"
        (click)="payroll.emit()">
      </p-button>
      <p-button
        icon="pi pi-refresh"
        label="Tải lại"
        [text]="true"
        (click)="reload.emit()">
      </p-button>
    </div>
  </div>
</section>
