<p-dialog [(visible)]="visible" (visibleChange)="visibleChange.emit($event)" [style]="{width:'500px'}" [header]="user?.id ? 'Chỉnh sửa người dùng' : 'Thêm người dùng mới'" [modal]="true" [draggable]="false" [resizable]="false"><div class="dialog-form"><div class="form-field"><label>Tên đăng nhập <span class="required">*</span></label><input pInputText [(ngModel)]="user.username" placeholder="Nhập tên đăng nhập..."><small class="text-red-500" *ngIf="submitted && !user.username">Tên đăng nhập là bắt buộc</small></div><div class="form-field"><label>Họ và tên</label><input pInputText [(ngModel)]="user.fullName"></div><div class="form-field"><label>Mật khẩu</label><input pInputText type="password" [(ngModel)]="user.password" [placeholder]="user.id ? 'Để trống nếu không đổi' : 'Nhập mật khẩu'"></div><div class="form-field"><label>Lương theo ca</label><p-inputNumber [(ngModel)]="user.shiftSalary" mode="currency" currency="VND" locale="vi-VN"></p-inputNumber></div><div class="form-field"><label>Vai trò</label><p-autoComplete [(ngModel)]="role" [suggestions]="roleResults" (completeMethod)="searchRoles($event)" optionLabel="name" [dropdown]="true"></p-autoComplete></div></div><ng-template pTemplate="footer"><button pButton label="Hủy" class="btn-cancel" (click)="visibleChange.emit(false)"></button><button pButton label="Lưu" icon="pi pi-check" (click)="save.emit({user, role})"></button></ng-template></p-dialog>
