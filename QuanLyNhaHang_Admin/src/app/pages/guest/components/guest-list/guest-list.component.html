<section class="management-card">
  <div class="table-header">
    <div class="search-section">
      <i class="pi pi-search"></i>
      <input pInputText placeholder="Tìm tên hoặc số điện thoại..." (input)="filter($event)" />
    </div>
    <div class="selection-info">Đã chọn: {{ selectedGuests.length }}</div>
  </div>
  
  <p-table #dt [value]="guests" [selection]="selectedGuests" (selectionChange)="onSelectionChange($event)" dataKey="id" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,25]" [globalFilterFields]="['name','phone','points']" styleClass="custom-table">
    <ng-template #header>
      <tr>
        <th style="width:3rem"><p-tableHeaderCheckbox /></th>
        <th pSortableColumn="name">Tên khách <p-sortIcon field="name" /></th>
        <th>Số điện thoại</th>
        <th pSortableColumn="points">Điểm <p-sortIcon field="points" /></th>
        <th>Ghi chú</th>
        <th pSortableColumn="created">Ngày tạo <p-sortIcon field="created" /></th>
        <th style="width:10rem">Hành động</th>
      </tr>
    </ng-template>
    <ng-template #body let-guest>
      <tr>
        <td><p-tableCheckbox [value]="guest" /></td>
        <td class="name-cell">{{ guest.name }}</td>
        <td>{{ guest.phone }}</td>
        <td><p-tag [value]="guest.points + ' điểm'" severity="info" /></td>
        <td class="description-cell">{{ guest.description || '—' }}</td>
        <td>{{ guest.created | date:'dd/MM/yyyy' }}</td>
        <td>
          <div class="action-buttons">
            <button pButton icon="pi pi-eye" class="btn-view" (click)="analyze.emit(guest)" aria-label="Xem phân tích AI"></button>
            <button pButton icon="pi pi-pencil" class="btn-edit" (click)="edit.emit(guest)" aria-label="Sửa khách hàng"></button>
            <button pButton icon="pi pi-trash" class="btn-delete" (click)="delete.emit(guest)" aria-label="Xóa khách hàng"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty-state">Chưa có khách hàng nào.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
