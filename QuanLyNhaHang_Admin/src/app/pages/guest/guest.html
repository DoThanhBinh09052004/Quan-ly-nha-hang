<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="management-container">
  <app-guest-toolbar
    [guestCount]="guests.length"
    [selectedCount]="selectedGuests.length"
    (create)="openNew()"
    (deleteSelected)="deleteSelected()"
    (reload)="loadGuests()">
  </app-guest-toolbar>

  <app-guest-list
    [guests]="guests"
    [selectedGuests]="selectedGuests"
    [loading]="loadingGuests"
    (selectedGuestsChange)="onSelectionChange($event)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    (analyze)="analyze($event)">
  </app-guest-list>
</div>

<app-guest-form-dialog
  [visible]="guestDialog"
  [guest]="editingGuest"
  (visibleChange)="closeGuestDialog($event)"
  (save)="saveGuest($event)">
</app-guest-form-dialog>

<app-guest-analysis-dialog
  [visible]="analysisDialog"
  [guest]="selectedGuest"
  [analysis]="analysis"
  [loading]="loadingAnalysis"
  [featureRows]="featureRows"
  (visibleChange)="closeAnalysisDialog($event)">
</app-guest-analysis-dialog>
