<div class="order-management-container">
    <p-toast />
    <p-confirmDialog></p-confirmDialog>
    
    <app-order-toolbar 
        [totalRecords]="totalRecords" 
        [todayRevenue]="todayRevenue" 
        [selectedCount]="selectedOrders.length"
        (create)="openNew()" 
        (deleteSelected)="deleteSelectedOrders()" 
        (exportCSV)="customExportCSV()" 
        (reload)="loadData()">
    </app-order-toolbar>

    <app-completed-dishes-table></app-completed-dishes-table>

    <app-order-list 
        [orders]="orders" 
        [selectedOrders]="selectedOrders" 
        [totalRecords]="totalRecords"
        [loading]="loadingOrders" 
        [first]="first" 
        [rows]="rows" 
        [qrLoading]="qrLoading" 
        [qrOrderId]="qrOrder?.id"
        [isManager]="isManager"
        (selectedOrdersChange)="selectedOrders = $event" 
        (lazyLoad)="onLazyLoad($event)"
        (globalFilter)="onGlobalFilter($event)" 
        (payQr)="openQrPayment($event)" 
        (edit)="editOrder($event)" 
        (delete)="deleteOrder($event)">
    </app-order-list>

    <app-order-form-dialog 
        [(visible)]="orderDialog" 
        [order]="order" 
        [orderItems]="orderItems"
        [guesttables]="guesttables" 
        [selectedGuestTable]="selectedGuestTable" 
        [filterGuestTable]="filterGuestTable"
        [guestPhone]="guestPhone" 
        [guestName]="guestName" 
        [guestPoints]="guestPoints"
        [pointsAvailable]="pointsAvailable" 
        [pointsToUse]="pointsToUse" 
        [maxPoints]="maxPoints"
        [minPoints]="minPoints" 
        [pointsDiscount]="pointsDiscount" 
        [finalPrice]="finalPrice" 
        [recommendations]="recommendations"
        (selectedGuestTableChange)="selectedGuestTable = $event" 
        (searchGuestTable)="searchGuestTable($event)"
        (guestPhoneChange)="guestPhone = $event" 
        (searchGuestByPhone)="searchGuestByPhone()"
        (paidAmountChange)="order.paidAmount = $event; calculateChangeAmount()"
        (pointsToUseChange)="pointsToUse = $event" 
        (onPointsChange)="onPointsChange()" 
        (openAddItemDialog)="openAddItemDialog()" 
        (updateQuantity)="updateQuantity($event.item, $event.event)"
        (removeOrderItem)="removeOrderItem($event)" 
        (addRecommendedItem)="addRecommendedItem($event)"
        (saveOrder)="saveOrder()" 
        (hideDialog)="hideDialog()">
    </app-order-form-dialog>

    <app-order-qr-dialog 
        [(visible)]="qrDialog" 
        [loading]="qrLoading" 
        [expired]="qrExpired"
        [error]="qrError" 
        [payment]="qrPayment" 
        [remainingTimeStr]="formatQrRemainingTime()"
        (closeQrDialog)="closeQrDialog()" 
        (createQrPayment)="createQrPayment()"
        (retryPaymentStatus)="retryPaymentStatus()">
    </app-order-qr-dialog>

    <app-item-picker-dialog 
        [(visible)]="addItemDialog" 
        [items]="items" 
        [categories]="categories"
        (addItem)="onItemPickerAdd($event)">
    </app-item-picker-dialog>
</div>
