<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Quản lý nhà hàng Admin</title>
        <base href="/">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://unpkg.com/primeicons/primeicons.css" rel="stylesheet" />
        <link href="https://unpkg.com/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="https://primefaces.org/cdn/primeng/images/favicon.png">
        
    </head>
    <body>
        <!-- <theme-switcher /> -->
        <div class="card">
            <p-toast />
            <p-confirmDialog></p-confirmDialog>
            <p-toolbar class="mb-6">
                <ng-template pTemplate="start">
                    <p-button icon="pi pi-plus" class="mr-2" [rounded]="true" [outlined]="true" label="Thêm tình trạng" (click)="openNew()" />
                </ng-template>

                <ng-template pTemplate="end">
                    <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
                </ng-template>
                
            </p-toolbar>
            <p-table
            #dt
            [value]="Statues"
            [rows]="10"
            [columns]="cols"
            [paginator]="true"
            [tableStyle]="{ 'min-width': '75rem' }"
            [(selection)]="selectedStatues"
            [rowHover]="true"
            dataKey="id"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [showCurrentPageReport]="true"
        >
            
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                    </th>
                    <th style="min-width: 16rem">Mã</th>
                    <th pSortableColumn="name" style="min-width:16rem">
                        <div class="flex items-center gap-2">
                            Tên
                            <p-sortIcon field="name" />
                        </div>
                    </th>
                    <!-- <th>Image</th> -->
                    <th pSortableColumn="description" style="min-width: 12rem">
                        <div class="flex items-center gap-2">
                            Chú thích
                            <p-sortIcon field="description" />
                        </div>
                    </th>
                    <th pSortableColumn="createdAt" style="min-width: 12rem">
                        <div class="flex items-center gap-2">
                            Ngày tạo
                            <p-sortIcon field="createdAt" />
                        </div>
                    </th>
                    <th pSortableColumn="updatedAt" style="min-width: 12rem">
                        <div class="flex items-center gap-2">
                            Ngày chỉnh sửa
                            <p-sortIcon field="updatedAt" />
                        </div>
                    </th>
                    <th style="min-width: 12rem"></th>
                </tr>
            </ng-template>
            <ng-template #body let-Status let-columns="columns">
                <tr>
                    <td style="width: 3rem">
                        <p-tableCheckbox [value]="Status" />
                    </td>
                    <td style="min-width: 16rem">{{ Status.id }}</td>
                    <td style="min-width: 16rem">{{ Status.name }}</td>
                    <!-- <td>
                        <img [src]="'https://primefaces.org/cdn/primeng/images/demo/Status/' + Status.image" [alt]="Status.name" style="width: 64px" class="rounded" />
                    </td> -->
                    <td>{{ Status.description }}</td>
                    <td>{{ Status.created}}</td>
                    <td>{{ Status.updated}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editStatus(Status)" />
                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteStatus(Status)" />
                    </td>
             
            </ng-template>
        </p-table>
        <p-dialog [(visible)]="StatusDialog" [style]="{ width: '450px' }" header="Thông tin trạng thái" [modal]="true">
            <ng-template #content>
                <div class="flex flex-col gap-6">
                    <div>
                        <label for="name" class="p-field">Tình trạng</label>
                        <input type="text" pInputText id="name" [(ngModel)]="Status.name" required autofocus fluid />
                        <small class="text-red-500" *ngIf="submitted && !Status.name">Tên là bắt buộc.</small>
                    </div>
                    <div>
                        <label for="description" class="p-field">Chú thích</label>
                        <textarea  pInputText id="description" pTextarea [(ngModel)]="Status.description"   fluid></textarea>
                    </div>
                </div>
            </ng-template>
    
            <ng-template #footer>
                <p-button label="Hủy" icon="pi pi-times" text (click)="hideDialog()" />
                <p-button label="Lưu" icon="pi pi-check" (click)="saveStatus()" />
            </ng-template>
        </p-dialog>
        </div>
       

    </body>
</html>
