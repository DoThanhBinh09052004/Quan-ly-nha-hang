<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<main class="management-container item-management-container inventory-page">
  <app-ingredient-toolbar
    [totalIngredients]="ingredients.length"
    [lowStockCount]="lowStockCount"
    [totalBatchCount]="totalBatchCount"
    [expiringSoonBatchCount]="expiringSoonBatchCount"
    [selectedCount]="selectedIngredients.length"
    (create)="openNew()"
    (forecast)="openRestockForecast()"
    (deleteSelected)="deleteSelected()"
    (reload)="loadData()">
  </app-ingredient-toolbar>

  <app-ingredient-list
    [ingredients]="ingredients"
    [selectedIngredients]="selectedIngredients"
    [batchesByIngredient]="batchesByIngredient"
    [batchLoading]="batchLoading"
    [loading]="loading"
    (selectedIngredientsChange)="onSelectionChange($event)"
    (requestBatches)="loadBatches($event)"
    (addBatch)="openBatch($event)"
    (editBatch)="editBatch($event)"
    (deleteBatch)="deleteBatch($event)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    (showForecast)="showForecast($event)">
  </app-ingredient-list>
</main>

<app-ingredient-form-dialog
  [visible]="dialogVisible"
  [saving]="savingIngredient"
  [ingredient]="ingredient"
  (visibleChange)="closeDialog($event)"
  (save)="save($event)">
</app-ingredient-form-dialog>

<app-ingredient-batch-dialog
  [visible]="batchDialogVisible"
  [saving]="savingBatch"
  [ingredient]="batchIngredient"
  [batch]="selectedBatch"
  (visibleChange)="closeBatchDialog($event)"
  (save)="saveBatch($event)">
</app-ingredient-batch-dialog>

<app-ingredient-forecast-dialog
  [visible]="forecastVisible"
  [ingredient]="ingredient"
  [forecastDays]="forecastDays"
  [loading]="forecastLoading"
  [forecastRows]="forecastRows"
  (visibleChange)="closeForecast($event)">
</app-ingredient-forecast-dialog>

<app-ingredient-restock-dialog
  [visible]="restockVisible"
  [forecastDays]="forecastDays"
  [loading]="restockLoading"
  [restockRows]="restockRows"
  (visibleChange)="closeRestock($event)">
</app-ingredient-restock-dialog>
