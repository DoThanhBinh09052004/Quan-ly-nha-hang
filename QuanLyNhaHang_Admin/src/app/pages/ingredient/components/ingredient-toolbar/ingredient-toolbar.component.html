<section class="management-card">
  <div class="header-section">
    <div class="header-title">
      <h1>Quản lý nguyên liệu</h1>
      <p>Theo dõi tồn kho theo từng lô, hạn sử dụng và nhu cầu nhập hàng.</p>
    </div>

    <div class="header-stats">
      <div class="stats-grid inventory-stats">
        <div class="stat-card stat-blue">
          <i class="pi pi-box"></i>
          <div class="stat-info">
            <span class="stat-label">Nguyên liệu</span>
            <span class="stat-value">{{ totalIngredients }}</span>
          </div>
        </div>
        <div class="stat-card stat-green">
          <i class="pi pi-clone"></i>
          <div class="stat-info">
            <span class="stat-label">Lô còn hàng</span>
            <span class="stat-value">{{ totalBatchCount }}</span>
          </div>
        </div>
        <div class="stat-card stat-orange">
          <i class="pi pi-exclamation-triangle"></i>
          <div class="stat-info">
            <span class="stat-label">Cần nhập</span>
            <span class="stat-value">{{ lowStockCount }}</span>
          </div>
        </div>
        <div class="stat-card stat-purple">
          <i class="pi pi-clock"></i>
          <div class="stat-info">
            <span class="stat-label">Sắp hết hạn</span>
            <span class="stat-value">{{ expiringSoonBatchCount }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar-section">
    <div class="toolbar-left">
      <p-button icon="pi pi-plus" label="Thêm nguyên liệu" severity="primary" [rounded]="true" (onClick)="create.emit()"></p-button>
      <p-button icon="pi pi-sparkles" label="Dự đoán nhập hàng" severity="info" [rounded]="true" [outlined]="true" (onClick)="forecast.emit()"></p-button>
      <p-button icon="pi pi-trash" label="Xóa đã chọn" severity="danger" [rounded]="true" [outlined]="true" [disabled]="selectedCount === 0" (onClick)="deleteSelected.emit()"></p-button>
    </div>
    <div class="toolbar-right">
      <p-button icon="pi pi-refresh" label="Tải lại" [text]="true" (onClick)="reload.emit()"></p-button>
    </div>
  </div>
</section>
