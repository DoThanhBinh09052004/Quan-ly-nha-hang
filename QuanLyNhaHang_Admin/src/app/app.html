<theme-switcher></theme-switcher>

<p-menubar
  *ngIf="showMenu"
  [model]="items"
  styleClass="app-menubar"
>
  <ng-template pTemplate="start">
    <div class="menu-logo">
      <i class="pi pi-store" aria-hidden="true"></i>
      <span class="menu-title">Restaurant Manager</span>
    </div>
  </ng-template>
</p-menubar>

<main class="main-content" [class.main-content--with-menu]="showMenu">
  <router-outlet></router-outlet>
</main>
